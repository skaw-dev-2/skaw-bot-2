name: SKAW Auto Message Tests

on:
  pull_request:
    paths:
      - 'src/services/autoMessageService.js'
      - 'src/services/autoMessageInteractionHandlers.js'
      - 'src/commands/Utility/automessage.js'
      - 'src/commands/Utility/automessage-manage.js'
      - 'src/events/ready.js'
      - 'src/tests/autoMessageService.test.js'
      - '.github/workflows/auto-message-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/services/autoMessageService.js'
      - 'src/services/autoMessageInteractionHandlers.js'
      - 'src/commands/Utility/automessage.js'
      - 'src/commands/Utility/automessage-manage.js'
      - 'src/events/ready.js'
      - 'src/tests/autoMessageService.test.js'
      - '.github/workflows/auto-message-tests.yml'

permissions:
  contents: read

jobs:
  auto-message-tests:
    name: Auto Message scheduler tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Message scheduler tests
        run: node --test src/tests/autoMessageService.test.js
