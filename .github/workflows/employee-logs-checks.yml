name: Employee Logs checks

on:
  push:
    branches:
      - feat/employee-logs-management-v2
      - main
    paths:
      - 'src/commands/Utility/employee-logs.js'
      - 'src/services/autoResponderService.js'
      - 'src/services/autoResponderPanelService.js'
      - 'src/events/messageCreate.js'
      - 'src/tests/autoResponderService.test.js'
      - 'src/services/employeeLogsService.js'
      - 'src/services/employeeLogsInteractionService.js'
      - 'src/services/employeeLogsAutoRoleService.js'
      - 'src/services/employeeRoleRegistryService.js'
      - 'src/services/employeeDirectoryService.js'
      - 'src/events/interactionCreate.js'
      - 'src/events/guildMemberUpdate.js'
      - 'src/tests/employeeRoleRegistry.test.js'
      - 'src/tests/employeeLogsAutoRole.test.js'
      - 'src/tests/employeeLogsAutoRoleDispatch.test.js'
      - 'src/tests/employeeLogsRecord.test.js'
      - 'src/tests/employeeLogsDirectoryIntegration.test.js'
      - 'src/tests/employeeDirectoryService.test.js'
      - 'scripts/check-employee-logs-v2.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/employee-logs-checks.yml'
  pull_request:
    paths:
      - 'src/commands/Utility/employee-logs.js'
      - 'src/services/autoResponderService.js'
      - 'src/services/autoResponderPanelService.js'
      - 'src/events/messageCreate.js'
      - 'src/tests/autoResponderService.test.js'
      - 'src/services/employeeLogsService.js'
      - 'src/services/employeeLogsInteractionService.js'
      - 'src/services/employeeLogsAutoRoleService.js'
      - 'src/services/employeeRoleRegistryService.js'
      - 'src/services/employeeDirectoryService.js'
      - 'src/events/interactionCreate.js'
      - 'src/events/guildMemberUpdate.js'
      - 'src/tests/employeeRoleRegistry.test.js'
      - 'src/tests/employeeLogsAutoRole.test.js'
      - 'src/tests/employeeLogsAutoRoleDispatch.test.js'
      - 'src/tests/employeeLogsRecord.test.js'
      - 'src/tests/employeeLogsDirectoryIntegration.test.js'
      - 'src/tests/employeeDirectoryService.test.js'
      - 'scripts/check-employee-logs-v2.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/employee-logs-checks.yml'

permissions:
  contents: read

jobs:
  employee-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Employee Logs v2 structure and syntax
        run: npm run check:employee-logs
      - name: Run Employee Logs and Directory tests
        run: npm run test:employee-logs
      - name: Run Auto Responder tests
        run: npm run test:auto-responder
