name: SKAW Giveaway Reroll Tests

on:
  pull_request:
    paths:
      - 'src/commands/Giveaway/**'
      - 'src/handlers/giveawayButtons.js'
      - 'src/services/giveawayService.js'
      - 'src/tests/giveawayReroll.test.js'
      - '.github/workflows/giveaway-reroll-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/commands/Giveaway/**'
      - 'src/handlers/giveawayButtons.js'
      - 'src/services/giveawayService.js'
      - 'src/tests/giveawayReroll.test.js'
      - '.github/workflows/giveaway-reroll-tests.yml'

permissions:
  contents: read

jobs:
  giveaway-reroll-tests:
    name: Giveaway reroll tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run giveaway reroll tests
        run: node --test src/tests/giveawayReroll.test.js
