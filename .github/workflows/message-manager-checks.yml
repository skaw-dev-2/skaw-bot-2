name: Message Manager Checks

on:
  pull_request:
    paths:
      - "src/commands/Utility/message.js"
      - "src/services/messageManagerService.js"
      - "src/events/interactionCreate.js"
      - "src/tests/messageManagerService.test.js"
      - "src/tests/messageManagerCommand.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/message-manager-checks.yml"

jobs:
  message-manager:
    name: Message Manager validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check src/services/messageManagerService.js
          node --check src/commands/Utility/message.js
          node --check src/events/interactionCreate.js
          node --check src/tests/messageManagerService.test.js
          node --check src/tests/messageManagerCommand.test.js

      - name: Run Message Manager tests
        run: npm run test:message-manager
