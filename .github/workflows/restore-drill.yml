name: Restore Drill

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: titanbot
          POSTGRES_PASSWORD: titanbot
          POSTGRES_DB: titanbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U titanbot -d titanbot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://titanbot:titanbot@localhost:5432/titanbot
      POSTGRES_VERIFY_URL: postgresql://titanbot:titanbot@localhost:5432/titanbot
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: titanbot
      POSTGRES_USER: titanbot
      POSTGRES_PASSWORD: titanbot
      POSTGRES_SSL: "false"
      SCHEMA_VERSION: "1"
      SCHEMA_VERSION_LABEL: "baseline-v1"
      BACKUP_ENCRYPTION_KEY: "ci-only-skaw-backup-key-0123456789abcdef-not-a-production-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PostgreSQL client tools
        run: sudo apt-get update ; sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Test backup encryption and tamper detection
        run: npm run test:backup-crypto

      - name: Create encrypted full database archive
        run: npm run backup:db

      - name: Verify encrypted archive and required tables
        run: npm run backup:verify

      - name: Verify database tables and SKAW feature inventory
        run: npm run restore:verify

      - name: Run restore drill
        run: npm run backup:drill
