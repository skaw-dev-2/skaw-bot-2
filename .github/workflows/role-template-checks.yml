name: Role Template checks

on:
  push:
    branches:
      - role-template-system-v1
      - main
    paths:
      - 'src/commands/Utility/role.js'
      - 'src/services/roleTemplateService.js'
      - 'src/services/roleTemplatePanelService.js'
      - 'src/events/messageCreate.js'
      - 'src/events/interactionCreate.js'
      - 'src/handlers/loaders/commandLoader.js'
      - 'src/tests/roleTemplateService.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/role-template-checks.yml'
  pull_request:
    paths:
      - 'src/commands/Utility/role.js'
      - 'src/services/roleTemplateService.js'
      - 'src/services/roleTemplatePanelService.js'
      - 'src/events/messageCreate.js'
      - 'src/events/interactionCreate.js'
      - 'src/handlers/loaders/commandLoader.js'
      - 'src/tests/roleTemplateService.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/role-template-checks.yml'

permissions:
  contents: read

jobs:
  role-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/commands/Utility/role.js
          node --check src/services/roleTemplateService.js
          node --check src/services/roleTemplatePanelService.js
          node --check src/events/messageCreate.js
          node --check src/events/interactionCreate.js
          node --check src/handlers/loaders/commandLoader.js
      - name: Run Role Template tests
        run: npm run test:role-templates
      - name: Run Auto Responder regression tests
        run: npm run test:auto-responder
