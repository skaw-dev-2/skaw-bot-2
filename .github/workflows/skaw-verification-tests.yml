name: SKAW Verification Tests

on:
  push:
    branches:
      - feature/skaw-verification-system
  pull_request:
    branches:
      - main
    paths:
      - 'src/services/skawVerificationService.js'
      - 'src/commands/Utility/verification.js'
      - 'src/interactions/buttons/skawVerification.js'
      - 'src/interactions/modals/skawVerification.js'
      - 'src/events/guildMemberAdd.js'
      - 'src/tests/skawVerificationService.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skaw-verification-tests.yml'

jobs:
  verification-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run SKAW verification tests
        run: npm run test:skaw-verification
