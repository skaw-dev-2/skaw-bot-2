name: SKAW Website Webhook Tests

on:
  push:
    branches: [main, feature/website-integration-webhook]
    paths:
      - "src/integrations/websiteWebhook.js"
      - "src/tests/websiteWebhook.test.js"
      - "src/app.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-webhook-tests.yml"
  pull_request:
    paths:
      - "src/integrations/websiteWebhook.js"
      - "src/tests/websiteWebhook.test.js"
      - "src/app.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-webhook-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/integrations/websiteWebhook.js
      - run: node --check src/app.js
      - run: npm run test:website-webhook
